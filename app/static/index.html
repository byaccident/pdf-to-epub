<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to ePub Converter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>PDF to ePub Converter</h1>
        <div class="upload-section">
            <input type="file" id="fileInput" accept="application/pdf">
            <button id="convertBtn" onclick="startConversion()">Convert</button>
        </div>

        <div id="progressSection" class="hidden">
            <p id="statusText">Starting...</p>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="resultSection" class="hidden">
            <p>Conversion Complete!</p>
            <a id="downloadLink" href="#" class="button">Download ePub</a>
            <button onclick="resetUI()" class="secondary">Convert Another</button>
        </div>

        <div id="errorSection" class="hidden error">
            <p id="errorText"></p>
            <button onclick="resetUI()" class="secondary">Try Again</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
